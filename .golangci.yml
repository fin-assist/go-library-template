# golangci-lint v2 (version pinned in .github/workflows/ci.yml).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # Errors that reach the client are built only by the finerr constructors
        # (grpc-api.md 5.2): a hand-made status can carry a misspelled reason or miss a
        # required metadata key, and bank-bff turns it into 500. A bare internal code is
        # built in one function of the library with a nolint and its reason.
        - pattern: ^status\.(Error|Errorf|New|Newf|FromProto)$
          pkg: ^google\.golang\.org/grpc/status$
          msg: build client-facing errors with finerr (grpc-api.md 5.2)
        - pattern: ^errdetails\.ErrorInfo$
          pkg: ^google\.golang\.org/genproto/googleapis/rpc/errdetails$
          msg: ErrorInfo is built only by finerr (grpc-api.md 5.2)
        - pattern: ^grpc\.Errorf$
          msg: build errors with finerr (grpc-api.md 5.2)
        # A custom forbid list replaces forbidigo's default one: keep its print rules.
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: take a *slog.Logger from the service
        # A library never reaches for process-wide state: the service passes the logger, the
        # metrics registry, the HTTP client and the settings in (AGENTS.md, «Writing code»).
        # scripts/test_lint_policy.py runs this linter on a probe of every forbidden and allowed form.
        - pattern: ^slog\.(Default|SetDefault|SetLogLoggerLevel|Debug|DebugContext|Info|InfoContext|Warn|WarnContext|Error|ErrorContext|Log|LogAttrs)$
          pkg: ^log/slog$
          msg: take a *slog.Logger from the service
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Default|Writer|SetOutput|SetFlags|SetPrefix|Flags|Prefix|Output)$
          pkg: ^log$
          msg: take a *slog.Logger from the service
        - pattern: ^grpclog\..+$
          pkg: ^google\.golang\.org/grpc/grpclog$
          msg: take a *slog.Logger from the service
        - pattern: ^prometheus\.(MustRegister|Register|Unregister|DefaultRegisterer|DefaultGatherer)$
          pkg: ^github\.com/prometheus/client_golang/prometheus$
          msg: register metrics on the prometheus.Registerer the service passes in
        - pattern: ^promauto\.New.+$
          pkg: ^github\.com/prometheus/client_golang/prometheus/promauto$
          msg: register metrics on the prometheus.Registerer the service passes in
        - pattern: ^promhttp\.Handler$
          pkg: ^github\.com/prometheus/client_golang/prometheus/promhttp$
          msg: serve the registry the service passes in (promhttp.HandlerFor)
        - pattern: ^expvar\..+$
          pkg: ^expvar$
          msg: expvar is a process-wide registry; export metrics through the service's registerer
        - pattern: ^http\.(DefaultClient|DefaultTransport|DefaultServeMux|Handle|HandleFunc|Get|Head|Post|PostForm|ListenAndServe|ListenAndServeTLS)$
          pkg: ^net/http$
          msg: take the *http.Client or the handler from the service
        - pattern: ^otel\.(Get|Set).+$
          pkg: ^go\.opentelemetry\.io/otel$
          msg: take the provider from the service
        - pattern: ^signal\.(Notify|NotifyContext|Ignore|Reset|Stop)$
          pkg: ^os/signal$
          msg: signal handling belongs to the service's main
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv|Setenv|Unsetenv|Clearenv|Args|UserHomeDir|UserConfigDir|UserCacheDir)$
          pkg: ^os$
          msg: a library takes its settings from the service, not from the environment
        - pattern: ^syscall\.(Getenv|Environ|Setenv|Unsetenv|Clearenv)$
          pkg: ^syscall$
          msg: a library takes its settings from the service, not from the environment
        - pattern: ^(unix|windows)\.(Getenv|Environ|Setenv|Unsetenv|Clearenv)$
          pkg: ^golang\.org/x/sys/(unix|windows)$
          msg: a library takes its settings from the service, not from the environment
    depguard:
      # No frameworks, ORMs, DI containers; the standard library first (AGENTS.md, «Principles»).
      rules:
        main:
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: no web frameworks, use net/http
            - pkg: github.com/labstack/echo
              desc: no web frameworks, use net/http
            - pkg: github.com/gofiber/fiber
              desc: no web frameworks, use net/http
            - pkg: github.com/go-chi/chi
              desc: net/http ServeMux has method and path patterns
            - pkg: github.com/gorilla/mux
              desc: net/http ServeMux has method and path patterns
            - pkg: github.com/go-kit/kit
              desc: no frameworks
            - pkg: gorm.io
              desc: no ORM, SQL on pgx
            - pkg: entgo.io
              desc: no ORM, SQL on pgx
            - pkg: github.com/jmoiron/sqlx
              desc: SQL on pgx
            - pkg: go.uber.org/fx
              desc: no DI containers, explicit wiring in internal/app
            - pkg: go.uber.org/dig
              desc: no DI containers, explicit wiring in internal/app
            - pkg: github.com/google/wire
              desc: no DI generators, explicit wiring in internal/app
            - pkg: github.com/spf13/viper
              desc: configuration is internal/config
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog
            - pkg: go.uber.org/zap
              desc: use log/slog
            - pkg: github.com/rs/zerolog
              desc: use log/slog
            - pkg: github.com/pkg/errors
              desc: use errors and fmt.Errorf with %w
            - pkg: github.com/stretchr/testify
              desc: use testing
            - pkg: github.com/golang/mock
              desc: write fakes of the consumer-side interfaces
            - pkg: go.uber.org/mock
              desc: write fakes of the consumer-side interfaces
  exclusions:
    rules:
      # Tests build statuses to play a failing peer.
      - path: _test\.go
        linters: [forbidigo, gosec, noctx]
      # The test PostgreSQL is chosen by TEST_DATABASE_URL / TEST_POSTGRES_IMAGE / CI.
      - path: internal/pgtest/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fin-assist/go-library-template
